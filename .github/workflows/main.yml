name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar dependências
        run: npm install

      - name: Executar Testes Unitários
        run: npm test -- --watchAll=false

      # Configuração de Alerta (Semana 6)
      - name: Alerta de Falha
        if: failure()
        run: echo "::error title=Falha no Workflow::Os testes unitários falharam! Verifique o código antes de aprovar a PR."
